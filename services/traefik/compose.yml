services:
  traefik:
    image: traefik:v3.7
    networks:
      - traefik
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - type: bind
        source: ./dynamic
        target: /etc/traefik/dynamic
      - type: bind
        source: ./traefik.yml
        target: /etc/traefik/traefik.yml
      - type: bind
        source: ./certs
        target: /etc/traefik/certs

networks:
  traefik:
    name: traefik